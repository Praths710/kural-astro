name: Keep site awake

# Render's free plan sleeps after 15 min without visitors; a ping every 10 min keeps the site awake.
# One always-on service fits Render's 750 free hours a month (FinBuddy's ping is paused for that reason).
# Pings https://kural-astro.onrender.com unless the repo variable SITE_URL names another address
# (Settings > Secrets and variables > Actions > Variables).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the health endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kural-astro.onrender.com' }}
        run: curl -fsS -m 90 --retry 3 --retry-delay 15 "$SITE_URL/health"
