name: Keep site awake

# Free hosts put the app to sleep when nobody visits; a ping every 10 min keeps it awake.
# The address comes from the repo variable SITE_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://your-name-kural-astro.hf.space, so moving hosts needs no code change.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    timeout-minutes: 4
    steps:
      - name: Ping the health endpoint
        run: curl -fsS -m 90 --retry 3 --retry-delay 15 "${{ vars.SITE_URL }}/health"
